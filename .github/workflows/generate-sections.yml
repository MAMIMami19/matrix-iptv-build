name: Generate Showmax+ sections addon
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} python3 virtual-addon/generate.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: virtual-addon/out}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: ${{ steps.deployment.outputs.page_url }}}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
