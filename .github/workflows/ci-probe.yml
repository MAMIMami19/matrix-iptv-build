name: CI probe (temporary diagnostics)

# Temporary: a 15-minute sleep job to test whether LONG jobs can run at
# all on this account. The Matrix 3.0 release builds keep getting
# cancelled at 9-15 min with no error; if this sleep job is also
# cancelled, the cause is account-level (e.g. Actions minutes quota),
# not the build. DELETE after the diagnosis.
on:
  workflow_dispatch:
  push:
    branches: [matrix-3.0-nuvio-1.2]
    paths: [.github/workflows/ci-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          echo "probe start: $(date -u +%H:%M:%S)"
          sleep 900
          echo "probe ok after 15 min: $(date -u +%H:%M:%S)"
