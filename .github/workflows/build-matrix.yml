name: Build Matrix 3.0

# Matrix 3.0 (NuvioTV 1.2.0 base) CI. Runs on pushes to the rebase branch
# and on manual dispatch; the release-publish step lives on main's workflow.
# Signing uses the same NUVIO_KEYSTORE_B64 secret as the v2.x releases,
# so builds from this workflow install OVER the Matrix on the box.
on:
  workflow_dispatch:
  push:
    branches: [matrix-3.0-nuvio-1.2]

# Serialize runs: two concurrent full-release builds died together when the
# runner pool cancelled them (runs 43618067580/43618374036); queue instead.
concurrency:
  group: matrix-3.0-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties (backend config + release signing)
        run: |
          echo "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}"
            echo "NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}"
            echo "NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}"
            echo "NUVIO_XTREAM_SERVER=${{ secrets.NUVIO_XTREAM_SERVER }}"
            echo "NUVIO_XTREAM_USER=${{ secrets.NUVIO_XTREAM_USER }}"
            echo "NUVIO_XTREAM_PASS=${{ secrets.NUVIO_XTREAM_PASS }}"
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}"
          } > local.properties

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed Full release APKs
        run: |
          chmod +x gradlew
          # lintVitalAnalyzeFullRelease is skipped: on the 7 GB GitHub
          # runner it forks a second JVM while the Gradle daemon holds its
          # heap. --max-workers=2 caps parallel Kotlin/native workers so
          # peak memory stays well under the runner's limit: a 15-minute
          # idle probe job completed fine while the full build kept being
          # cancelled with no error at 9-15 min (runs 43618067580,
          # 43618374036, 43622287943, 43623679091, 43632913528,
          # 43634260306) — the one success (run 43624695533) used the 4g
          # heap. Re-enable on a bigger runner.
          ./gradlew :app:assembleFullRelease -x lintVitalAnalyzeFullRelease --max-workers=2 --stacktrace --console=plain

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: matrix-3.0-release-apks
          path: "app/build/outputs/apk/full/release/*.apk"
          if-no-files-found: error
