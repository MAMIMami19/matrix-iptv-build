name: Build Matrix 3.5.5

# Matrix 3.5.5: adds two more embedded backup Xtream lines (xsmart,
# CI secrets NUVIO_XTREAM5_* / NUVIO_XTREAM6_*) to the four 3.5.4
# shipped. All 3.5.4 behavior unchanged (hero fixes, Gold IPTV focus,
# no IPTV Settings tab). The new lines appear in the IPTV source
# switcher as Backup 4 / Backup 5 (existing index-based labels).
# Signing uses the same NUVIO_KEYSTORE_B64 secret as the v2.x/3.0/3.1/
# 3.2/3.3/3.4/3.5/3.5.1/3.5.2/3.5.3/3.5.4 releases, so this installs
# OVER Matrix 3.5.4 on box and phone.
on:
  workflow_dispatch:
  push:
    branches: [matrix-3.5.5-xsmart]

# Serialize runs: two concurrent full-release builds died together when the
# runner pool cancelled them (runs 43618067580/43618374036); queue instead.
concurrency:
  group: matrix-3.5.5-xsmart-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties (backend config + release signing)
        run: |
          echo "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}"
            echo "NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}"
            echo "NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}"
            echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}"
            echo "NUVIO_XTREAM_SERVER=${{ secrets.NUVIO_XTREAM_SERVER }}"
            echo "NUVIO_XTREAM_USER=${{ secrets.NUVIO_XTREAM_USER }}"
            echo "NUVIO_XTREAM_PASS=${{ secrets.NUVIO_XTREAM_PASS }}"
            echo "NUVIO_XTREAM2_SERVER=${{ secrets.NUVIO_XTREAM2_SERVER }}"
            echo "NUVIO_XTREAM2_USER=${{ secrets.NUVIO_XTREAM2_USER }}"
            echo "NUVIO_XTREAM2_PASS=${{ secrets.NUVIO_XTREAM2_PASS }}"
            echo "NUVIO_XTREAM3_SERVER=${{ secrets.NUVIO_XTREAM3_SERVER }}"
            echo "NUVIO_XTREAM3_USER=${{ secrets.NUVIO_XTREAM3_USER }}"
            echo "NUVIO_XTREAM3_PASS=${{ secrets.NUVIO_XTREAM3_PASS }}"
            echo "NUVIO_XTREAM4_SERVER=${{ secrets.NUVIO_XTREAM4_SERVER }}"
            echo "NUVIO_XTREAM4_USER=${{ secrets.NUVIO_XTREAM4_USER }}"
            echo "NUVIO_XTREAM4_PASS=${{ secrets.NUVIO_XTREAM4_PASS }}"
            echo "NUVIO_XTREAM5_SERVER=${{ secrets.NUVIO_XTREAM5_SERVER }}"
            echo "NUVIO_XTREAM5_USER=${{ secrets.NUVIO_XTREAM5_USER }}"
            echo "NUVIO_XTREAM5_PASS=${{ secrets.NUVIO_XTREAM5_PASS }}"
            echo "NUVIO_XTREAM6_SERVER=${{ secrets.NUVIO_XTREAM6_SERVER }}"
            echo "NUVIO_XTREAM6_USER=${{ secrets.NUVIO_XTREAM6_USER }}"
            echo "NUVIO_XTREAM6_PASS=${{ secrets.NUVIO_XTREAM6_PASS }}"
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}"
          } > local.properties

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed Full release APKs
        run: |
          chmod +x gradlew
          # lintVitalAnalyzeFullRelease is skipped: on the 7 GB GitHub
          # runner it forks a second JVM while the Gradle daemon holds its
          # heap. --max-workers=2 caps parallel Kotlin/native workers so
          # peak memory stays well under the runner's limit: a 15-minute
          # idle probe job completed fine while the full build kept being
          # cancelled with no error at 9-15 min (runs 43618067580,
          # 43618374036, 43622287943, 43623679091, 43632913528,
          # 43634260306) — the one success (run 43624695533) used the 4g
          # heap. Re-enable on a bigger runner.
          ./gradlew :app:assembleFullRelease -x lintVitalAnalyzeFullRelease --max-workers=2 --stacktrace --console=plain

      - name: Upload release APKs to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Artifact storage quota is hit (500 MB; usage recalculates only
          # every 6-12 h), so the APKs go to a DRAFT release instead — drafts
          # are invisible to the in-app updater (unauthenticated API calls
          # never see them, and the tag is not a valid version anyway).
          # Delete the draft after the APKs are verified/downloaded.
          TAG="matrix-3.5.5-draft-${{ github.run_number }}"
          gh release create "$TAG" \
            --draft \
            --title "Matrix 3.5.5 draft (CI run ${{ github.run_number }})" \
            --notes "CI-built Matrix 3.5.5 release APKs (adds two embedded backup Xtream lines, xsmart, as Backup 4 / Backup 5 in the IPTV source switcher; all 3.5.4 behavior unchanged). Draft only — do not publish without review." \
            app/build/outputs/apk/full/release/*.apk
