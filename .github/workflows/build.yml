name: Build Showmax+ (debug baseline)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'virtual-addon/**'
      - '.github/workflows/generate-sections.yml' 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Write local.properties (backend config + release signing)
        run: |
          echo "${{ secrets.NUVIO_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "NUVIO_SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}"
            echo "NUVIO_SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}"
            echo "NUVIO_SUPABASE_FALLBACK_URL=${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}"
            echo "NUVIO_XTREAM_SERVER=${{ secrets.NUVIO_XTREAM_SERVER }}"
            echo "NUVIO_XTREAM_USER=${{ secrets.NUVIO_XTREAM_USER }}"
            echo "NUVIO_XTREAM_PASS=${{ secrets.NUVIO_XTREAM_PASS }}"
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "NUVIO_RELEASE_STORE_PASSWORD=${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}"
            echo "NUVIO_RELEASE_KEY_ALIAS=${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}"
            echo "NUVIO_RELEASE_KEY_PASSWORD=${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}"
          } > local.properties
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -Pnuvio.android.distribution=full --stacktrace --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: showmax-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn

      - name: Build signed Full release APK
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full --stacktrace --console=plain
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: showmax-release-apks
          path: "androidApp/build/outputs/apk/full/release/*.apk"
          if-no-files-found: warn
      - name: Publish release APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="matrix-iptv-1.0-${GITHUB_RUN_NUMBER}"
          APK=$(ls androidApp/build/outputs/apk/full/release/*.apk | head -1)
          gh release create "$TAG" "$APK" --title "Matrix IPTV 1.0 (build $GITHUB_RUN_NUMBER)" --notes "Matrix IPTV 1.0 release APK" 2>/dev/null || \
          gh release upload "$TAG" "$APK" --clobber
